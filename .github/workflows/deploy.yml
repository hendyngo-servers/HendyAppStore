name: Hendy App Store — Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "functions/**"
      - "workers/**"
      - "packages/**"
      - "android/**"
      - "windows/**"
      - "ios/**"
      - "macos/**"
      - "scripts/**"
      - "automation/**"
      - "tests/**"
      - "package.json"
      - "vite.config.ts"
      - "wrangler.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-cloudflare.yml
    secrets: inherit
