name: Hendy App Store — Multi-OS Build Matrix

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "android/**"
      - "windows/**"
      - "ios/**"
      - "macos/**"
      - "packages/**"
      - "workers/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/matrix-build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_signed:
        description: "Sign verified products and publish to Cloudflare R2 (requires protected signing secrets)"
        required: true
        type: boolean
        default: false
      source_ref:
        description: "Branch, tag, or commit to build"
        required: false
        type: string
        default: main
      build_id:
        description: "Optional Admin build request ID"
        required: false
        type: string
        default: manual
      target:
        description: "Requested target (the matrix currently builds all supported targets)"
        required: false
        type: choice
        options: [all, android, windows, ios, macos]
        default: all

permissions:
  contents: read
  actions: read

concurrency:
  group: hendy-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-latest
          - target: windows
            runner: windows-2025
          - target: ios
            runner: macos-latest
          - target: macos
            runner: macos-latest
    steps:
      - name: Checkout requested source without persisted Git credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source, test core logic and build storefront
        run: |
          npm run validate
          npm test
          npm run build
      - name: Prepare artifact directories
        shell: bash
        run: mkdir -p matrix-output/unsigned
      - name: Setup Java for Android
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle for Android
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Android APK and AAB (unsigned)
        if: matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android assembleRelease bundleRelease
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          AAB="$(find android/app/build/outputs/bundle/release -type f -name '*.aab' -print -quit 2>/dev/null || true)"
          if [ -n "$APK" ]; then cp "$APK" matrix-output/unsigned/android.apk; else echo "Android build did not emit APK." > matrix-output/android-build.txt; fi
          if [ -n "$AAB" ]; then cp "$AAB" matrix-output/unsigned/android.aab; else echo "Android build did not emit AAB." >> matrix-output/android-build.txt; fi
      - name: Setup .NET for Windows
        if: matrix.target == 'windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows self-contained launcher (unsigned)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force matrix-output/unsigned | Out-Null
          dotnet publish windows/HendyAppStore.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o matrix-output/windows-publish
          $exe = Get-ChildItem -Path matrix-output/windows-publish -Filter "HendyAppStore.exe" -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw "Windows project built but HendyAppStore.exe was not emitted." }
          Copy-Item $exe.FullName matrix-output/unsigned/windows.exe
      - name: Build iOS app bundle (unsigned)
        if: matrix.target == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/HendyAppStore.xcodeproj -scheme HendyAppStore -configuration Release -sdk iphoneos -derivedDataPath matrix-output/ios-derived CODE_SIGNING_ALLOWED=NO build
          APP="$(find matrix-output/ios-derived/Build/Products -type d -name '*.app' -path '*Release-iphoneos*' -print -quit 2>/dev/null || true)"
          if [ -z "$APP" ]; then echo "Xcode did not emit an iOS .app bundle." > matrix-output/ios-build.txt; exit 0; fi
          mkdir -p matrix-output/unsigned/ios-app
          ditto "$APP" "matrix-output/unsigned/ios-app/$(basename "$APP")"
      - name: Build macOS app bundle and DMG (unsigned)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project macos/HendyAppStoreMac.xcodeproj -scheme HendyAppStoreMac -configuration Release -sdk macosx -derivedDataPath matrix-output/macos-derived CODE_SIGNING_ALLOWED=NO build
          APP="$(find matrix-output/macos-derived/Build/Products -type d -name '*.app' -path '*Release*' -print -quit 2>/dev/null || true)"
          if [ -z "$APP" ]; then echo "Xcode did not emit a macOS .app bundle." > matrix-output/macos-build.txt; exit 0; fi
          mkdir -p matrix-output/unsigned/macos-app
          ditto "$APP" "matrix-output/unsigned/macos-app/$(basename "$APP")"
          hdiutil create -volname "Hendy App Store" -srcfolder "$APP" -ov -format UDZO matrix-output/unsigned/macos.dmg
      - name: Upload build products and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: matrix-output/
          if-no-files-found: error
          retention-days: 10

  sign:
    name: Sign and verify / ${{ matrix.target }}
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_signed == true }}
    runs-on: ${{ matrix.runner }}
    environment: release-signing
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-latest
          - target: windows
            runner: windows-2025
          - target: ios
            runner: macos-latest
          - target: macos
            runner: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: release-input
      - name: Prepare signed output
        shell: bash
        run: mkdir -p matrix-output/signed
      - name: Sign and verify Windows executable with SignTool
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $exe = "release-input/unsigned/windows.exe"
          if (!(Test-Path $exe)) { Write-Host "No Windows executable was produced; nothing to sign."; exit 0 }
          if (!$env:WINDOWS_CERT_PFX_BASE64 -or !$env:WINDOWS_CERT_PASSWORD) { Write-Warning "Windows signing secrets are not configured; no Windows artifact will be published as signed."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "hendy-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signTool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signTool) { throw "SignTool.exe not found on runner." }
          & $signTool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exe
          if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed." }
          & $signTool.FullName verify /pa /v $exe
          if ($LASTEXITCODE -ne 0) { throw "SignTool signature verification failed." }
          Copy-Item $exe matrix-output/signed/windows.exe
      - name: Sign APK and AAB with Android keystore
        if: matrix.target == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="release-input/unsigned/android.apk"
          AAB="release-input/unsigned/android.aab"
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Android signing secrets are not configured; no Android artifact will be published as signed."; exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hendy-release.keystore"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -f "$APK" ]; then
            test -n "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/hendy-release.keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --out "$RUNNER_TEMP/hendy-signed.apk" "$APK"
            "$APKSIGNER" verify --verbose "$RUNNER_TEMP/hendy-signed.apk"
            cp "$RUNNER_TEMP/hendy-signed.apk" matrix-output/signed/android.apk
          fi
          if [ -f "$AAB" ]; then
            jarsigner -keystore "$RUNNER_TEMP/hendy-release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -signedjar "$RUNNER_TEMP/hendy-signed.aab" "$AAB" "$ANDROID_KEY_ALIAS"
            jarsigner -verify -strict "$RUNNER_TEMP/hendy-signed.aab"
            cp "$RUNNER_TEMP/hendy-signed.aab" matrix-output/signed/android.aab
          fi
      - name: Sign iOS app and package IPA
        if: matrix.target == 'ios'
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="$(find release-input/unsigned/ios-app -type d -name '*.app' -print -quit 2>/dev/null || true)"
          if [ -z "$APP" ]; then echo "No iOS .app bundle was produced."; exit 0; fi
          if [ -z "${IOS_CERTIFICATE_P12_BASE64:-}" ] || [ -z "${IOS_CERTIFICATE_PASSWORD:-}" ] || [ -z "${IOS_PROVISION_PROFILE_BASE64:-}" ]; then echo "iOS signing secrets are missing; no IPA will be published."; exit 0; fi
          CERT="$RUNNER_TEMP/hendy-ios-signing.p12"; PROFILE="$RUNNER_TEMP/hendy-profile.mobileprovision"; KEYCHAIN="$RUNNER_TEMP/hendy-signing.keychain-db"; KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"; security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY="${IOS_SIGNING_IDENTITY:-$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '\"' '/Apple Distribution|iPhone Distribution/{print $2; exit}')}"
          test -n "$IDENTITY" || { echo "No iOS signing identity found."; exit 1; }
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE" "$APP/embedded.mobileprovision"
          codesign --force --deep --sign "$IDENTITY" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"; ditto "$APP" "$RUNNER_TEMP/Payload/$(basename "$APP")"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/hendy.ipa"
          cp "$RUNNER_TEMP/hendy.ipa" matrix-output/signed/ios.ipa
      - name: Sign macOS app and DMG; notarize when App Store credentials exist
        if: matrix.target == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          APP="$(find release-input/unsigned/macos-app -type d -name '*.app' -print -quit 2>/dev/null || true)"
          DMG="release-input/unsigned/macos.dmg"
          if [ -z "$APP" ] || [ ! -f "$DMG" ]; then echo "No macOS app/DMG was emitted."; exit 0; fi
          if [ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ] || [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ] || [ -z "${MACOS_SIGNING_IDENTITY:-}" ]; then echo "macOS Developer ID secrets missing; no DMG will be published as signed."; exit 0; fi
          CERT="$RUNNER_TEMP/hendy-macos.p12"; KEYCHAIN="$RUNNER_TEMP/hendy-macos.keychain-db"; PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"; security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --deep --strict "$APP"
          hdiutil create -volname "Hendy App Store" -srcfolder "$APP" -ov -format UDZO matrix-output/signed/macos.dmg
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            xcrun notarytool submit matrix-output/signed/macos.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
            xcrun stapler staple matrix-output/signed/macos.dmg
          else
            echo "Developer ID signature verified; notarytool credentials missing, so notarization was not performed."
          fi
      - name: Upload verified signed products only
        uses: actions/upload-artifact@v4
        with:
          name: signed-build-${{ matrix.target }}
          path: matrix-output/signed/
          if-no-files-found: ignore
          retention-days: 30

  publish-r2:
    name: Publish signed artifacts and manifests to Cloudflare R2
    needs: sign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_signed == true && success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-build-*
          path: release-artifacts
          merge-multiple: false
          if-no-artifact-found: ignore
      - name: Publish verified signed artifacts and catalog manifests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "::error::Cloudflare credentials are required to publish signed artifacts."; exit 1; fi
          count=0
          publish_one() {
            local platform="$1" file="$2" filename="$3" mime="$4"
            [ -f "$file" ] || return 0
            local version="${GITHUB_SHA:0:12}"
            local key="artifacts/$platform/$version/$filename"
            local catalog_id="$version-$platform-${filename//./-}"
            npx --yes wrangler@4 r2 object put "hendy-app-store-releases/$key" --file "$file" --content-type "$mime" --remote
            export PLATFORM="$platform" FILE="$file" OBJECT_KEY="$key" RELEASE_VERSION="$version" CATALOG_ID="$catalog_id"
            node --input-type=module <<'NODE'
            import { readFileSync, writeFileSync, statSync } from "node:fs";
            import { createHash } from "node:crypto";
            const bytes = readFileSync(process.env.FILE);
            const manifest = {
              id: process.env.CATALOG_ID,
              appName: "Hendy App Store",
              description: "Artifact emitted by the protected multi-platform signing pipeline.",
              filename: process.env.FILE.split(/[\\/]/).pop(),
              version: process.env.RELEASE_VERSION,
              platform: process.env.PLATFORM,
              objectKey: process.env.OBJECT_KEY,
              sha256: createHash("sha256").update(bytes).digest("hex"),
              size: statSync(process.env.FILE).size,
              publishedAt: new Date().toISOString(),
              public: true,
              signatureStatus: "verified-by-platform-signing-tool"
            };
            writeFileSync("/tmp/hendy-release-catalog.json", JSON.stringify(manifest, null, 2) + "\n");
            NODE
            npx --yes wrangler@4 r2 object put "hendy-app-store-releases/catalog/$catalog_id.json" --file /tmp/hendy-release-catalog.json --content-type application/json --remote
            count=$((count + 1))
            echo "Published $platform artifact $filename to R2 after signature verification."
          }
          publish_one android release-artifacts/signed-build-android/android.apk android.apk application/vnd.android.package-archive
          publish_one android release-artifacts/signed-build-android/android.aab android.aab application/octet-stream
          publish_one windows release-artifacts/signed-build-windows/windows.exe windows.exe application/vnd.microsoft.portable-executable
          publish_one ios release-artifacts/signed-build-ios/ios.ipa ios.ipa application/octet-stream
          publish_one macos release-artifacts/signed-build-macos/macos.dmg macos.dmg application/x-apple-diskimage
          echo "Published $count verified artifact(s). No unsigned output was made public."

  build-status-notify:
    name: Callback build result to Admin D1
    needs: build
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send signed result callback
        env:
          BUILD_STATUS_WEBHOOK_URL: ${{ secrets.BUILD_STATUS_WEBHOOK_URL }}
          BUILD_STATUS_WEBHOOK_SECRET: ${{ secrets.BUILD_STATUS_WEBHOOK_SECRET }}
          BUILD_REQUEST_ID: ${{ inputs.build_id != 'manual' && inputs.build_id || '' }}
          RUN_ID: ${{ github.run_id }}
          RUN_CONCLUSION: ${{ needs.build.result }}
          RUN_SHA: ${{ github.sha }}
          RUN_BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BUILD_STATUS_WEBHOOK_URL:-}" ] || [ -z "${BUILD_STATUS_WEBHOOK_SECRET:-}" ]; then
            echo "::warning::Build callback secrets are not configured; GitHub Actions still records the run status."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { createHmac } from "node:crypto";
          const now = new Date().toISOString();
          const data = {
            build_request_id: process.env.BUILD_REQUEST_ID || "",
            workflow: { name: process.env.WORKFLOW_NAME || "Hendy App Store — Multi-OS Build Matrix" },
            workflow_run: {
              id: Number(process.env.RUN_ID || 0),
              status: "completed",
              conclusion: process.env.RUN_CONCLUSION || "unknown",
              head_sha: process.env.RUN_SHA || "",
              head_branch: process.env.RUN_BRANCH || "main",
              html_url: process.env.RUN_URL || "",
              run_started_at: now,
              updated_at: now
            }
          };
          const body = JSON.stringify(data);
          const signature = "sha256=" + createHmac("sha256", process.env.BUILD_STATUS_WEBHOOK_SECRET).update(body).digest("hex");
          const response = await fetch(process.env.BUILD_STATUS_WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-hendy-signature-256": signature },
            body
          });
          if (!response.ok) throw new Error("Build status callback failed with HTTP " + response.status + ": " + (await response.text()).slice(0, 500));
          console.log("Build status callback accepted by the Admin notifier.");
          NODE
