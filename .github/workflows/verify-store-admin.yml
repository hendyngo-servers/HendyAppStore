name: Verify Storefront and Admin Console

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-store-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and dual-page production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate runtime deployment contract
        run: npm run check:deployment

      - name: Typecheck
        run: npm run lint

      - name: Run Worker route and Access-auth tests
        run: npm test

      - name: Build separate storefront and admin HTML entrypoints
        run: npm run build

      - name: Assert both applications were emitted independently
        run: |
          test -s dist/index.html
          test -s dist/admin.html
          node scripts/verify-store-admin-build.mjs

