name: Hendy App Store CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate structure, tests and Pages output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Validate new architecture and absence of legacy source
        run: npm run validate
      - name: Unit and security-guard tests
        run: npm test
      - name: Build public Pages bundle
        run: npm run build
      - name: Test Pages production runtime-config generation
        env:
          HENDY_API_BASE_URL: https://api-smoke-test.workers.dev
          HENDY_EDGE_BASE_URL: https://edge-smoke-test.workers.dev
        run: |
          node scripts/prepare-pages.mjs
          grep -F 'https://api-smoke-test.workers.dev/api' dist/pages/config.js
          grep -F 'https://edge-smoke-test.workers.dev/admin' dist/pages/config.js
      - name: Render placeholder resource IDs for offline Wrangler validation
        env:
          D1_DATABASE_ID: "00000000-0000-0000-0000-000000000001"
          KV_NAMESPACE_ID: "00000000000000000000000000000001"
        run: node scripts/render-cloudflare-config.mjs
      - name: Validate all Worker bundles without deploying
        run: |
          npx wrangler deploy --dry-run --config workers/backend-api/wrangler.toml
          npx wrangler deploy --dry-run --config workers/alert-notifier/wrangler.toml
          npx wrangler deploy --dry-run --config wrangler.toml
          npx wrangler deploy --dry-run --config workers/edge-router/wrangler.toml
      - name: Verify output tree
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/pages/index.html
          test -s dist/pages/config.js
          test -s dist/pages/web-user/src/app.js
          test -s dist/pages/web-admin/index.html
          test -s dist/pages/web-admin/automation.bundle.js
