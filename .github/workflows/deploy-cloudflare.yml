name: Deploy Hendy App Store to Cloudflare Workers and Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "workers/**"
      - "packages/**"
      - "android/**"
      - "windows/**"
      - "ios/**"
      - "macos/**"
      - "scripts/**"
      - "automation/**"
      - "tests/**"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and deploy Cloudflare resources
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cloudflare-production
    steps:
      - name: Checkout source without persisted Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Validate structure, tests and build
        run: |
          npm run validate
          npm test
          npm run build
      - name: Validate required Cloudflare and Access settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN || secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD || secrets.CF_ACCESS_AUD }}
          CF_ACCESS_ADMIN_EMAILS: ${{ vars.CF_ACCESS_ADMIN_EMAILS || secrets.CF_ACCESS_ADMIN_EMAILS }}
          SELF_HEAL_WEBHOOK_SECRET: ${{ secrets.SELF_HEAL_WEBHOOK_SECRET }}
          AUTO_HEAL_ENABLED: ${{ vars.AUTO_HEAL_ENABLED || secrets.AUTO_HEAL_ENABLED || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Set CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "::error::CLOUDFLARE_ACCOUNT_ID must be 32 hex characters"; exit 1; }
          test -n "${CF_ACCESS_TEAM_DOMAIN:-}" || { echo "::error::Set CF_ACCESS_TEAM_DOMAIN"; exit 1; }
          test -n "${CF_ACCESS_AUD:-}" || { echo "::error::Set CF_ACCESS_AUD (one or more comma-separated AUD tags)"; exit 1; }
          test -n "${CF_ACCESS_ADMIN_EMAILS:-}" || { echo "::error::Set CF_ACCESS_ADMIN_EMAILS"; exit 1; }
          if [ "${AUTO_HEAL_ENABLED:-false}" = "true" ] && [ -z "${SELF_HEAL_WEBHOOK_SECRET:-}" ]; then echo "::error::SELF_HEAL_WEBHOOK_SECRET is required when AUTO_HEAL_ENABLED=true"; exit 1; fi
      - name: Provision R2, Pages, D1, KV, Queues and Workers hostname
        id: provision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-cloudflare-resources.mjs
      - name: Render runtime D1/KV bindings into Wrangler configs
        env:
          D1_DATABASE_ID: ${{ steps.provision.outputs.d1_id }}
          KV_NAMESPACE_ID: ${{ steps.provision.outputs.kv_id }}
          HENDY_API_BASE_URL: ${{ steps.provision.outputs.api_base }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://hendy-app-store.pages.dev' }}
        run: node scripts/render-cloudflare-config.mjs
      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute hendy-app-store-db --remote --config workers/backend-api/wrangler.toml --file workers/backend-api/src/db/schema.sql
      - name: Deploy Backend API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/backend-api/wrangler.toml
      - name: Set Backend API runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN || secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD || secrets.CF_ACCESS_AUD }}
          CF_ACCESS_ADMIN_EMAILS: ${{ vars.CF_ACCESS_ADMIN_EMAILS || secrets.CF_ACCESS_ADMIN_EMAILS }}
          GITHUB_SYNC_TOKEN: ${{ secrets.GITHUB_SYNC_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          AUTO_HEAL_ENABLED: ${{ vars.AUTO_HEAL_ENABLED || secrets.AUTO_HEAL_ENABLED || 'false' }}
          SELF_HEAL_WEBHOOK_SECRET: ${{ secrets.SELF_HEAL_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CF_ACCESS_TEAM_DOMAIN" | npx --yes wrangler@4 secret put CF_ACCESS_TEAM_DOMAIN --config workers/backend-api/wrangler.toml
          printf '%s' "$CF_ACCESS_AUD" | npx --yes wrangler@4 secret put CF_ACCESS_AUD --config workers/backend-api/wrangler.toml
          printf '%s' "$CF_ACCESS_ADMIN_EMAILS" | npx --yes wrangler@4 secret put CF_ACCESS_ADMIN_EMAILS --config workers/backend-api/wrangler.toml
          printf '%s' "$AUTO_HEAL_ENABLED" | npx --yes wrangler@4 secret put AUTO_HEAL_ENABLED --config workers/backend-api/wrangler.toml
          if [ -n "${SELF_HEAL_WEBHOOK_SECRET:-}" ]; then printf '%s' "$SELF_HEAL_WEBHOOK_SECRET" | npx --yes wrangler@4 secret put SELF_HEAL_WEBHOOK_SECRET --config workers/backend-api/wrangler.toml; fi
          if [ -n "${GITHUB_SYNC_TOKEN:-}" ]; then printf '%s' "$GITHUB_SYNC_TOKEN" | npx --yes wrangler@4 secret put GITHUB_SYNC_TOKEN --config workers/backend-api/wrangler.toml; else echo "::warning::GITHUB_SYNC_TOKEN missing; source sync and GitHub build dispatch won't work."; fi
          if [ -n "${LLM_API_KEY:-}" ]; then printf '%s' "$LLM_API_KEY" | npx --yes wrangler@4 secret put LLM_API_KEY --config workers/backend-api/wrangler.toml; else echo "::warning::LLM_API_KEY missing; AI patch proposals remain disabled."; fi
      - name: Deploy Alert Notifier Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/alert-notifier/wrangler.toml
      - name: Set Alert Notifier runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_STATUS_WEBHOOK_SECRET: ${{ secrets.BUILD_STATUS_WEBHOOK_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SELF_HEAL_WEBHOOK_SECRET: ${{ secrets.SELF_HEAL_WEBHOOK_SECRET }}
          AUTO_HEAL_ENABLED: ${{ vars.AUTO_HEAL_ENABLED || secrets.AUTO_HEAL_ENABLED || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${BUILD_STATUS_WEBHOOK_SECRET:-}" ]; then printf '%s' "$BUILD_STATUS_WEBHOOK_SECRET" | npx --yes wrangler@4 secret put BUILD_STATUS_WEBHOOK_SECRET --config workers/alert-notifier/wrangler.toml; else echo "::warning::BUILD_STATUS_WEBHOOK_SECRET missing; authenticated workflow callbacks are disabled."; fi
          if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then printf '%s' "$DISCORD_WEBHOOK_URL" | npx --yes wrangler@4 secret put DISCORD_WEBHOOK_URL --config workers/alert-notifier/wrangler.toml; fi
          if [ -n "${SELF_HEAL_WEBHOOK_SECRET:-}" ]; then printf '%s' "$SELF_HEAL_WEBHOOK_SECRET" | npx --yes wrangler@4 secret put SELF_HEAL_WEBHOOK_SECRET --config workers/alert-notifier/wrangler.toml; fi
          printf '%s' "$AUTO_HEAL_ENABLED" | npx --yes wrangler@4 secret put AUTO_HEAL_ENABLED --config workers/alert-notifier/wrangler.toml
      - name: Deploy Edge Router Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Prepare separate public Pages output
        id: pages
        env:
          HENDY_API_BASE_URL: ${{ steps.provision.outputs.api_base }}
          HENDY_EDGE_BASE_URL: ${{ steps.provision.outputs.edge_base }}
        run: node scripts/prepare-pages.mjs
      - name: Deploy Public Store to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist/pages --project-name hendy-app-store --branch main
      - name: Smoke test API, Edge Router and Pages
        env:
          HENDY_API_BASE_URL: ${{ steps.provision.outputs.api_base }}
          HENDY_EDGE_BASE: ${{ steps.provision.outputs.edge_base }}
          PAGES_BASE_URL: ${{ steps.provision.outputs.pages_base }}
        run: node scripts/smoke-test.mjs
      - name: Deployment summary
        if: always()
        env:
          API_BASE: ${{ steps.provision.outputs.api_base }}
          EDGE_BASE: ${{ steps.provision.outputs.edge_base }}
          ALERTS_BASE: ${{ steps.provision.outputs.alerts_base }}
          PAGES_BASE: ${{ steps.provision.outputs.pages_base }}
        run: |
          {
            echo "### Hendy App Store Cloudflare deployment"
            echo
            echo "- Public Store: ${PAGES_BASE:-not deployed}"
            echo "- Edge Router / Admin entry: ${EDGE_BASE:-not deployed}/admin"
            echo "- Backend API: ${API_BASE:-not deployed}"
            echo "- Alert Notifier: ${ALERTS_BASE:-not deployed}/webhooks/github/build-status"
            echo "- R2, D1, KV and Queue: hendy-app-store resources"
            echo "- Access policy: verify Cloudflare Zero Trust protects /admin*, /web-admin/* and /api/* before sharing Admin URL."
            echo "- Store publishing requires signed artifacts and protected developer-account credentials."
          } >> "$GITHUB_STEP_SUMMARY"
