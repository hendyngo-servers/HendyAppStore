# Standalone Cloudflare Workers Builds entry point.
# This config intentionally has no Backend API service binding so the first build
# can deploy even before the production API Worker is provisioned.
# The full integrated production router is deployed with:
# workers/edge-router/wrangler.toml via .github/workflows/deploy-cloudflare.yml
name = "hendyappstore"
main = "workers/edge-router/src/index.js"
compatibility_date = "2026-10-25"
workers_dev = true

[assets]
directory = "./apps"
binding = "STATIC_ASSETS"
not_found_handling = "none"
run_worker_first = ["/api*", "/admin*", "/web-admin", "/web-admin/*"]

[vars]
APP_NAME = "Hendy App Store"
ADMIN_HOSTNAMES = ""
