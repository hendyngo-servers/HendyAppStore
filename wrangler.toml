# Canonical edge router config; no secrets are stored in this file.
name = "hendy-app-store-edge"
main = "workers/edge-router/src/index.js"
compatibility_date = "2026-10-25"
workers_dev = true

[assets]
directory = "./apps"
binding = "STATIC_ASSETS"
# Keep unmatched routes in the Worker so /admin and /api routing/access checks run.
not_found_handling = "none"

[vars]
APP_NAME = "Hendy App Store"
ADMIN_HOSTNAMES = ""

[[services]]
binding = "BACKEND_API"
service = "hendy-app-store-api"
